<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1769d2">
  <meta name="description" content="عداد مئوي بسيط مع ساعة وتاريخ وثيمات ألوان">
  <title>عداد النسبة</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app" id="app">
    <section class="clock-panel" aria-label="الوقت والتاريخ">
      <div id="clock" class="clock">00:00:00</div>
      <div id="date" class="date">...</div>
    </section>

    <section class="themes" aria-label="اختيار لون الواجهة">
      <button class="swatch blue active" data-theme="blue" aria-label="اللون الأزرق" title="أزرق"></button>
      <button class="swatch black" data-theme="black" aria-label="اللون الأسود" title="أسود"></button>
      <button class="swatch brown" data-theme="brown" aria-label="اللون البني" title="بني"></button>
    </section>

    <button id="counterButton" class="counter-button" aria-label="زيادة العداد">
      <span id="percent" class="percent">0.0%</span>
      <span id="count" class="count">0 / 1000</span>
      <span class="hint">اضغط في أي مكان على الشاشة للزيادة</span>
    </button>

    <button id="resetButton" class="reset-button" type="button">إعادة الضبط RESET</button>
    <div id="message" class="message" aria-live="polite"></div>
  </main>
  <script src="./app.js"></script>
</body>
</html>
